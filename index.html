<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamReach Challenge — Достигайте целей вместе</title>
    <meta name="description" content="Отслеживайте командные челленджи и празднуйте общие результаты.">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
      function initializeTelegramApp() {
        if (window.Telegram && window.Telegram.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();
          console.log("Telegram SDK: Инициализация успешна");
        }
      }
      // Пробуем инициализировать сразу
      initializeTelegramApp();
      // И на случай медленной загрузки
      document.addEventListener("DOMContentLoaded", initializeTelegramApp);
      setTimeout(initializeTelegramApp, 500);
    </script>

    <meta property="og:title" content="TeamReach Challenge">
    <meta property="og:type" content="website">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
